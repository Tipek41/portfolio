<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bilgisayara veya aynı cihazda arkadaşına karşı satranç oyna." />
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'">
  <title>Satranç · Tolga İpek</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♟️</text></svg>">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="settings-bar">
<a class="games-back" href="../oyunlar.html">Oyunlar</a>
      <div class="setting">
        <label for="difficultySelect">Bot</label>
        <select id="difficultySelect" aria-label="Select bot difficulty">
          <option value="easy">Kolay</option>
          <option value="medium" selected>Orta</option>
          <option value="hard">Zor</option>
        </select>
      </div>
      <div class="controls">
        <button id="resetBtn" type="button" title="New game (N)">Yeni oyun</button>
        <button id="undoBtn" type="button" title="Undo (U)">Geri al</button>
        <button id="botBtn" type="button" class="secondary" title="Toggle bot (B)">Bot</button>
        <button id="flipBtn" type="button" title="Flip board (F)">Tahtayı çevir</button>
        <button id="hintBtn" type="button" title="Hint (H)">İpucu</button>
        <button id="resignBtn" type="button" class="danger" title="Resign">Terk et</button>
      </div>
      <div class="setting">
        <label class="theme-toggle" for="themeToggle" title="Toggle dark mode (T)">
          <span class="theme-label">Gece</span>
          <input id="themeToggle" type="checkbox" checked aria-label="Toggle dark mode" />
          <span class="theme-switch" aria-hidden="true"></span>
        </label>
        <button id="soundBtn" type="button" class="sound-btn" title="Toggle sound (M)" aria-label="Toggle sound">🔊</button>
      </div>
    </header>

    <div class="game-area">
      <aside class="player-bar black-bar">
        <div class="avatar" aria-hidden="true">♚</div>
        <div class="player-info">
          <span class="player-name">Siyah</span>
          <span class="turn-badge" id="blackTurn" aria-live="polite">Sıra sende</span>
        </div>
        <div class="captured" id="blackCaptured" aria-label="Pieces captured by black"></div>
      </aside>

      <main>
        <div id="board" class="board" role="grid" aria-label="Chess board" tabindex="0"></div>
      </main>

      <aside class="player-bar white-bar">
        <div class="avatar" aria-hidden="true">♔</div>
        <div class="player-info">
          <span class="player-name">Beyaz</span>
          <span class="turn-badge" id="whiteTurn" aria-live="polite">Sıra sende</span>
        </div>
        <div class="captured" id="whiteCaptured" aria-label="Pieces captured by white"></div>
      </aside>
    </div>

    <section class="extras">
      <div class="extra-panel move-history-panel">
        <h3>Hamleler</h3>
        <div id="moveHistory" class="move-history" aria-live="polite"></div>
      </div>
      <div class="extra-panel fen-panel">
        <h3>FEN</h3>
        <div class="fen-row">
          <input id="fenInput" type="text" readonly aria-label="Current FEN string" spellcheck="false" />
          <button id="copyFenBtn" type="button" title="Copy FEN">Kopyala</button>
        </div>
        <div class="fen-row">
          <input id="loadFenInput" type="text" placeholder="FEN konumunu yapıştır" aria-label="FEN string to load" spellcheck="false" />
          <button id="loadFenBtn" type="button">Yükle</button>
        </div>
      </div>
    </section>

    <footer>
      <p class="status" id="status" aria-live="polite">Sıra beyazda</p>
      <p class="credits">
        Kaynak: <a href="https://zrnge.com" target="_blank" rel="noopener noreferrer">zrnge</a> ·
        <a href="https://github.com/zrnge/chess" target="_blank" rel="noopener noreferrer">GitHub</a>
      </p>
    </footer>
  </div>

  <div id="gameOverModal" class="game-over-modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalSubtitle">
    <div class="game-over-card">
      <div class="trophy" id="modalIcon" aria-hidden="true">🏆</div>
      <h2 id="modalTitle">Beyaz kazandı!</h2>
      <p id="modalSubtitle">Şah mat</p>
      <button id="modalNewGame" type="button">Yeni oyun</button>
    </div>
  </div>

  <script src="chess.js" defer></script>
</body>
</html>
