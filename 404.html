<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' data: blob: https://cdnjs.cloudflare.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"><meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#060e19">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
  <title>Sayfa bulunamadı · Tolga İpek</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #060e19; color: #f2f6ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px 24px; }
    main { width: 100%; max-width: 580px; }
    .code { margin: 0 0 20px; color: #139cff; font-size: 16px; font-weight: 600; letter-spacing: 3px; }
    h1 { margin: 0 0 16px; font-size: clamp(32px, 7vw, 52px); line-height: 1.15; letter-spacing: -1px; }
    .message { margin: 0 0 32px; color: #acbdd1; font-size: 17px; line-height: 1.6; }
    a { display: inline-block; padding: 13px 20px; border: 1px solid #139cff; border-radius: 10px; color: #f2f6ff; text-decoration: none; font-size: 15px; font-weight: 600; }
    a:hover { background: #139cff; color: #060e19; }
    a:focus-visible { outline: 2px solid #f2f6ff; outline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Sayfa bulunamadı</h1>
    <p class="message">Aradığınız sayfa taşınmış veya kaldırılmış olabilir.</p>
    <a href="/">Ana sayfaya dön →</a>
  </main>
</body>
</html>
